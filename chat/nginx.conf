events {}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;

  server {
    listen 80;
    server_name raspberry.pi.local;

    root  /usr/share/nginx/html;
    index index.html;

    location /v1/ {
      proxy_pass http://host.docker.internal:8442;
      proxy_set_header Authorization "Bearer llm-local-dev-token-change-me";

      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Connection "";

      # Without this nginx buffers the whole SSE stream and the page
      # receives one lump at the end instead of token-by-token.
      proxy_buffering off;
      proxy_cache     off;

      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
