events {}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;

  server {
    listen 443 ssl;
    server_name offline.llm;

    ssl_certificate     /certs/offline.crt;
    ssl_certificate_key /certs/offline.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    location /v1/ {
      proxy_pass https://host.docker.internal:8442;
      proxy_set_header Authorization "Bearer llm-local-dev-token-change-me";

      proxy_ssl_server_name         on;
      proxy_ssl_name                offline.llm;
      proxy_ssl_verify              on;
      proxy_ssl_trusted_certificate /certs/offline.crt;
      proxy_ssl_protocols           TLSv1.2 TLSv1.3;

      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Connection "";

      proxy_buffering off;
      proxy_cache     off;

      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
