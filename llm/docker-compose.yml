services:
  ollama:
    image: ollama/ollama:0.32.5
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - models:/root/.ollama
    networks:
      default:
        aliases:
          - ollama
    restart: unless-stopped

  puller:
    image: ollama/ollama:0.32.5
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL must be set in .env}
    entrypoint:
      - /bin/bash
      - -c
      - |
        for _ in $$(seq 1 60); do
          ollama list >/dev/null 2>&1 && break
          sleep 1
        done
        have=$$(ollama list 2>/dev/null | awk 'NR>1 {print $$1}')
        if echo "$$have" | grep -qx "$$LLM_MODEL" \
           || echo "$$have" | grep -qx "$$LLM_MODEL:latest"; then
          echo "[puller] $$LLM_MODEL already in the volume - reusing, nothing to download"
          exit 0
        fi
        echo "[puller] $$LLM_MODEL not in the volume - pulling (one-time, may be several GB)"
        ollama pull "$$LLM_MODEL"
    restart: "no"

  rest:
    image: nginx:1.27-alpine
    ports:
      - "${LLM_PORT:?LLM_PORT must be set in .env}:${LLM_PORT:?LLM_PORT must be set in .env}"
    environment:
      LLM_BEARER_TOKEN: ${LLM_BEARER_TOKEN:?LLM_BEARER_TOKEN must be set in .env}
      LLM_PORT: ${LLM_PORT:?LLM_PORT must be set in .env}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^LLM_"
    extra_hosts:
      - "offline.llm:127.0.0.1"
    networks:
      default:
        aliases:
          - offline.llm
    volumes:
      - ./server/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./certs/offline.crt:/certs/offline.crt:ro
      - ./certs/offline.key:/certs/offline.key:ro
    depends_on:
      ollama:
        condition: service_started
      puller:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  models:
    name: ollama

networks:
  default:
